openapi: 3.0.3 # ignore `String does not match the pattern of "^3\.1\.\d+(-.+)?$".` warnings for now: https://github.com/oapi-codegen/oapi-codegen/issues/373
info:
  title: Noot API
  description: AI-powered nutrition logging API
  version: "1.0"
  contact:
    url: https://github.com/noot-app

servers:
  - url: /api/v1
    description: API v1

paths:
  /consumption:
    post:
      summary: Log a consumption via audio, text, or duplicate existing consumption
      description: |
        Submit consumption data in three ways:
        
        **1. Audio Upload (multipart/form-data):**
        Upload an audio file to be transcribed and processed by AI
        
        **2. Text Input (application/json OR multipart/form-data):**
        Provide text directly for AI processing
        
        **3. Duplicate Existing Consumption (application/json):**
        Copy an existing consumption by providing its ID. This skips AI processing and duplicates all items, nutrition data, title, note, and labels. This is commonly used when marking a past consumption as a favorite and then clicking a button like "+ re-add"
        
        **Example JSON payload to duplicate:**
        ```json
        {"consumption_id": "edc2bfd0-9648-4045-9467-40dada432fd5"}
        ```
        
        **Example JSON payload for text processing:**
        ```json
        {"text": "I ate a banana and yogurt for breakfast"}
        ```
        
        Note: For multipart/form-data, text takes precedence over audio if both are provided.
      operationId: createConsumption
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                audio:
                  type: string
                  format: binary
                  description: Audio file (webm, opus, mp3, wav) - ignored if text field is also provided
                text:
                  type: string
                  description: Text description of consumption - takes precedence over audio if both provided
              anyOf:
                - required: [audio]
                - required: [text]
          application/json:
            schema:
              oneOf:
                - type: object
                  description: Text input for AI processing
                  properties:
                    text:
                      type: string
                      description: Text description of consumption for AI processing
                      example: "I ate a banana and yogurt for breakfast"
                  required:
                    - text
                - type: object
                  description: Duplicate an existing consumption by ID
                  properties:
                    consumption_id:
                      type: string
                      description: ID of an existing consumption to duplicate (skips AI processing, copies all items, nutrition data, title, note, and labels)
                      example: "edc2bfd0-9648-4045-9467-40dada432fd5"
                  required:
                    - consumption_id
      responses:
        "200":
          description: Successful consumption analysis
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Consumption"
        "400":
          description: Bad request (invalid multipart form, no audio file, no text provided, etc.)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "405":
          description: Method not allowed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /consumption/{id}:
    get:
      summary: Get a single consumption
      description: Retrieve a single consumption by ID for the authenticated user
      operationId: getConsumption
      parameters:
        - name: id
          in: path
          required: true
          description: Consumption ID
          schema:
            type: string
      responses:
        "200":
          description: Consumption found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Consumption"
        "404":
          description: Consumption not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      summary: Update a consumption record
      description: Update an existing consumption with edited nutrition data
      operationId: updateConsumption
      parameters:
        - name: id
          in: path
          required: true
          description: Consumption ID
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateConsumptionRequest"
      responses:
        "200":
          description: Consumption updated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Consumption"
        "400":
          description: Bad request (invalid request body, validation errors)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Consumption not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    
    delete:
      summary: Delete a consumption record
      description: Delete a consumption record by ID (used for redo functionality)
      operationId: deleteConsumption
      parameters:
        - name: id
          in: path
          required: true
          description: Consumption ID
          schema:
            type: string
      responses:
        "200":
          description: Consumption deleted successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteResponse"
        "404":
          description: Consumption not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /public/consumption/{id}:
    get:
      summary: Get a public consumption
      description: Retrieve a public consumption by ID without authentication. Only returns consumptions marked as public, and excludes private information like labels and notes.
      operationId: getPublicConsumption
      parameters:
        - name: id
          in: path
          required: true
          description: Consumption ID
          schema:
            type: string
      responses:
        "200":
          description: Public consumption found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Consumption"
        "404":
          description: Public consumption not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /health:
    get:
      summary: Health check
      description: Get the health status of the API
      operationId: getHealth
      responses:
        "200":
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        "405":
          description: Method not allowed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /consumptions:
    get:
      summary: List consumptions
      description: Get a list of stored consumptions for the default user, optionally filtered by labels and date range. Supports tier-based date range limits - Free users can access up to 7 days, Pro users up to 365 days.
      operationId: getConsumptions
      parameters:
        - name: limit
          in: query
          description: Maximum number of consumptions to return (default 50, max 100)
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
        - name: offset
          in: query
          description: Number of consumptions to skip for pagination
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: labels
          in: query
          description: Comma-separated list of label names to filter by
          schema:
            type: string
            example: "lunch,trigger-foods"
        - name: match
          in: query
          description: Label matching strategy - 'any' matches consumptions with at least one of the labels, 'all' matches consumptions with all labels
          schema:
            type: string
            enum: [any, all]
            default: any
        - name: start
          in: query
          description: Start date (RFC3339 format) - cannot be used together with 'days' parameter
          schema:
            type: string
            format: date-time
        - name: end
          in: query
          description: End date (RFC3339 format) - cannot be used together with 'days' parameter
          schema:
            type: string
            format: date-time
        - name: days
          in: query
          description: Number of days to look back from today - cannot be used together with 'start/end' parameters. Free tier limited to 7 days, Pro tier to 365 days.
          schema:
            type: integer
            minimum: 1
            maximum: 365
      responses:
        "200":
          description: List of consumptions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConsumptionsResponse"
        "400":
          description: Invalid parameters (e.g., both start/end and days provided, invalid date format)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Access denied (subscription tier limitation - Free users limited to 7 days, Pro users to 365 days)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: User not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "405":
          description: Method not allowed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /goals:
    get:
      summary: Get nutrition goals
      description: Get resolved nutrition goals based on user profile (DRI) and any custom overrides
      operationId: getGoals
      parameters:
        - name: goal_name
          in: query
          required: false
          schema:
            type: string
          description: Name of the specific goal set to retrieve. If not provided, returns the active goal set.
        - name: source
          in: query
          required: false
          schema:
            type: string
            enum: [auto, dri]
            default: auto
          description: Force goal source. 'auto' uses user's active goal set if available, otherwise DRI. 'dri' forces DRI-only targets, ignoring custom overrides.
      responses:
        "200":
          description: User nutrition goals
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GoalsResponse"
        "404":
          description: User not found or goal set not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    
    put:
      summary: Update nutrition goals (Pro only)
      description: Set custom nutrition goal overrides for Pro users
      operationId: updateGoals
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateGoalsRequest"
      responses:
        "200":
          description: Goals updated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GoalsResponse"
        "400":
          description: Invalid request body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Access denied (Pro subscription required)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /goals/sets:
    get:
      summary: List all goal sets (Pro only)
      description: Get a list of all custom goal sets for the user
      operationId: getGoalSets
      responses:
        "200":
          description: List of goal sets
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GoalSetsResponse"
        "403":
          description: Access denied (Pro subscription required)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /goals/sets/{name}:
    delete:
      summary: Delete a goal set (Pro only)
      description: Delete a specific custom goal set
      operationId: deleteGoalSet
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
          description: Name of the goal set to delete
      responses:
        "204":
          description: Goal set deleted successfully
        "400":
          description: Cannot delete the active goal set
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Access denied (Pro subscription required)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Goal set not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /goals/active:
    put:
      summary: Set active goal set (Pro only)
      description: Set which goal set is currently active for the user
      operationId: setActiveGoalSet
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetActiveGoalRequest"
      responses:
        "200":
          description: Active goal set updated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GoalsResponse"
        "403":
          description: Access denied (Pro subscription required)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Goal set not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /favorites:
    get:
      summary: List user favorites
      description: Get all consumptions favorited by the current user
      operationId: getFavorites
      responses:
        "200":
          description: List of favorited consumptions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FavoritesResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      summary: Add consumption to favorites
      description: Add a consumption to the user's favorites list
      operationId: addToFavorites
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddFavoriteRequest"
      responses:
        "201":
          description: Consumption added to favorites successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Favorite"
        "400":
          description: Bad request (consumption already favorited, invalid ID)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Consumption not found or not owned by user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /favorites/{consumption_id}:
    delete:
      summary: Remove consumption from favorites
      description: Remove a consumption from the user's favorites list
      operationId: removeFromFavorites
      parameters:
        - name: consumption_id
          in: path
          required: true
          description: Consumption ID to remove from favorites
          schema:
            type: string
      responses:
        "200":
          description: Consumption removed from favorites successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteResponse"
        "404":
          description: Favorite not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /labels:
    get:
      summary: List labels
      description: Get all labels owned by the current user, including usage counts
      operationId: getLabels
      responses:
        "200":
          description: List of user labels with usage counts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LabelsResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      summary: Create a new label
      description: Create a new label for the current user
      operationId: createLabel
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LabelCreateRequest"
      responses:
        "201":
          description: Label created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Label"
        "400":
          description: Bad request (invalid color/name, validation errors)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Label name already exists for user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Label limit exceeded (100 labels per user)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /labels/{id}:
    put:
      summary: Update a label
      description: Update an existing label owned by the current user
      operationId: updateLabel
      parameters:
        - name: id
          in: path
          required: true
          description: Label ID
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LabelUpdateRequest"
      responses:
        "200":
          description: Label updated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Label"
        "400":
          description: Bad request (validation errors)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Label not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Label name already exists for user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      summary: Delete a label
      description: Delete a label and unassign it from all consumptions/items
      operationId: deleteLabel
      parameters:
        - name: id
          in: path
          required: true
          description: Label ID
          schema:
            type: string
      responses:
        "204":
          description: Label deleted successfully
        "404":
          description: Label not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /consumption/{id}/labels:
    get:
      summary: Get labels assigned to a consumption
      description: Get all labels assigned to a specific consumption
      operationId: getConsumptionLabels
      parameters:
        - name: id
          in: path
          required: true
          description: Consumption ID
          schema:
            type: string
      responses:
        "200":
          description: Labels assigned to the consumption
          content:
            application/json:
              schema:
                type: object
                properties:
                  labels:
                    type: array
                    items:
                      $ref: "#/components/schemas/Label"
        "404":
          description: Consumption not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      summary: Assign labels to a consumption
      description: Assign one or more labels to a consumption by label IDs
      operationId: assignConsumptionLabels
      parameters:
        - name: id
          in: path
          required: true
          description: Consumption ID
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssignLabelsRequest"
      responses:
        "200":
          description: Labels assigned successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  labels:
                    type: array
                    items:
                      $ref: "#/components/schemas/Label"
        "400":
          description: Bad request (invalid label IDs)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Consumption or label not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /consumption/{id}/labels/{labelId}:
    delete:
      summary: Unassign a label from a consumption
      description: Remove a label assignment from a consumption
      operationId: unassignConsumptionLabel
      parameters:
        - name: id
          in: path
          required: true
          description: Consumption ID
          schema:
            type: string
        - name: labelId
          in: path
          required: true
          description: Label ID
          schema:
            type: string
      responses:
        "204":
          description: Label unassigned successfully
        "404":
          description: Consumption or label assignment not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /consumption-items/{id}/labels:
    get:
      summary: Get labels assigned to a consumption item
      description: Get all labels assigned to a specific consumption item
      operationId: getConsumptionItemLabels
      parameters:
        - name: id
          in: path
          required: true
          description: Consumption item ID
          schema:
            type: string
      responses:
        "200":
          description: Labels assigned to the consumption item
          content:
            application/json:
              schema:
                type: object
                properties:
                  labels:
                    type: array
                    items:
                      $ref: "#/components/schemas/Label"
        "404":
          description: Consumption item not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      summary: Assign labels to a consumption item
      description: Assign one or more labels to a consumption item by label IDs
      operationId: assignConsumptionItemLabels
      parameters:
        - name: id
          in: path
          required: true
          description: Consumption item ID
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssignLabelsRequest"
      responses:
        "200":
          description: Labels assigned successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  labels:
                    type: array
                    items:
                      $ref: "#/components/schemas/Label"
        "400":
          description: Bad request (invalid label IDs)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Consumption item or label not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /consumption-items/{id}/labels/{labelId}:
    delete:
      summary: Unassign a label from a consumption item
      description: Remove a label assignment from a consumption item
      operationId: unassignConsumptionItemLabel
      parameters:
        - name: id
          in: path
          required: true
          description: Consumption item ID
          schema:
            type: string
        - name: labelId
          in: path
          required: true
          description: Label ID
          schema:
            type: string
      responses:
        "204":
          description: Label unassigned successfully
        "404":
          description: Consumption item or label assignment not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /events:
    get:
      summary: List events
      description: Get events owned by the current user with optional filtering
      operationId: getEvents
      parameters:
        - name: limit
          in: query
          description: Maximum number of events to return (default 50, max 100)
          schema:
            type: integer
            default: 50
            minimum: 1
            maximum: 100
        - name: offset
          in: query
          description: Number of events to skip for pagination
          schema:
            type: integer
            default: 0
            minimum: 0
        - name: start_date
          in: query
          description: Filter events starting from this date (ISO 8601)
          schema:
            type: string
            format: date-time
        - name: end_date
          in: query
          description: Filter events ending before this date (ISO 8601)
          schema:
            type: string
            format: date-time
        - name: event_type_id
          in: query
          description: Filter by event type ID
          schema:
            type: string
        - name: level_min
          in: query
          description: Filter events with level >= this value
          schema:
            type: integer
            minimum: 0
            maximum: 10
        - name: level_max
          in: query
          description: Filter events with level <= this value
          schema:
            type: integer
            minimum: 0
            maximum: 10
        - name: labels
          in: query
          description: Comma-separated list of label names to filter by
          schema:
            type: string
        - name: match
          in: query
          description: Label matching strategy - 'any' matches events with at least one of the labels, 'all' matches events with all labels
          schema:
            type: string
            enum: [any, all]
            default: any
      responses:
        "200":
          description: List of user events
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventsResponse"
        "400":
          description: Invalid query parameters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
