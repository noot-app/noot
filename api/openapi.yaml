    GoalsResponse:
      type: object
      required:
        - goals
        - user
      properties:
        goals:
          $ref: "#/components/schemas/Goals"
        user:
          $ref: "#/components/schemas/User"

    Goals:
      type: object
      required:
        - targets
        - upper_limits
        - units
        - source
        - life_stage
      properties:
        targets:
          type: object
          additionalProperties:
            type: number
          description: Target amounts for each nutrient
          example:
            calories: 2000
            protein_g: 50
            vitamin_c_mg: 90
        upper_limits:
          type: object
          additionalProperties:
            type: number
          description: Upper limit amounts for each nutrient (where defined)
          example:
            sodium_mg: 2300
        units:
          type: object
          additionalProperties:
            type: string
          description: Units for each nutrient
          example:
            calories: "kcal"
            protein_g: "g"
            vitamin_c_mg: "mg"
        source:
          type: string
          enum: [dri, custom]
          description: Source of the goals (DRI defaults or custom overrides)
        custom_name:
          type: string
          description: Name of the custom goal set (only present when source is "custom")
          example: "Bulk Season"
        life_stage:
          $ref: "#/components/schemas/LifeStage"

    LifeStage:
      type: object
      required:
        - sex
        - age_bracket
      properties:
        sex:
          type: string
          enum: [male, female, unspecified]
          description: User sex for DRI calculation
        age_bracket:
          type: string
          description: Age bracket used for DRI lookup
          example: "19-30 y"

    UpdateGoalsRequest:
      type: object
      required:
        - name
        - overrides
      properties:
        name:
          type: string
          maxLength: 50
          description: Custom name for the goal set (required for managing multiple goal sets)
          example: "Bulk Season"
        overrides:
          type: object
          additionalProperties:
            type: number
          description: Custom nutrition goal overrides
          example:
            calories: 3000
            protein_g: 180
            vitamin_c_mg: 120

    SetActiveGoalRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          maxLength: 50
          description: Name of the goal set to make active
          example: "Bulk Season"

    GoalSetsResponse:
      type: object
      required:
        - goal_sets
        - active_goal_name
        - user
      properties:
        goal_sets:
          type: array
          items:
            $ref: "#/components/schemas/GoalSetSummary"
          description: List of all available goal sets
        active_goal_name:
          type: string
          description: Name of the currently active goal set
          example: "Bulk Season"
        user:
          $ref: "#/components/schemas/User"

    GoalSetSummary:
      type: object
      required:
        - name
        - created_at
        - updated_at
      properties:
        name:
          type: string
          description: Name of the goal set
          example: "Bulk Season"
        created_at:
          type: string
          format: date-time
          description: When the goal set was created
          example: "2023-01-01T00:00:00Z"
        updated_at:
          type: string
          format: date-time
          description: When the goal set was last updated
          example: "2023-01-15T10:30:00Z"

    TrendsResponse:
      type: object
      required:
        - series
        - user
        - date_range
        - days
      properties:
        series:
          type: object
          additionalProperties:
            type: array
            items:
              $ref: "#/components/schemas/DataPoint"
          description: Time series data for each requested metric
          example:
            calories:
              - date: "2023-01-01T00:00:00Z"
                value: 2100
              - date: "2023-01-02T00:00:00Z"
                value: 2250
        user:
          $ref: "#/components/schemas/User"
        date_range:
          type: object
          properties:
            start:
              type: string
              format: date-time
            end:
              type: string
              format: date-time
        days:
          type: integer
          description: Number of days in the time series

    DataPoint:
      type: object
      required:
        - date
        - value
      properties:
        date:
          type: string
          format: date-time
          description: Date for this data point
        value:
          type: number
          description: Nutrient value for this date

    ExportResponse:
      type: object
      required:
        - series
        - user
        - date_range
        - format
      properties:
        series:
          type: object
          additionalProperties:
            type: array
            items:
              $ref: "#/components/schemas/DataPoint"
          description: Time series data for each requested metric
        user:
          $ref: "#/components/schemas/User"
        date_range:
          type: object
          properties:
            start:
              type: string
              format: date-time
            end:
              type: string
              format: date-time
        format:
          type: string
          enum: [csv, json]
          description: Export format used

    UpdateConsumptionRequest:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ItemWithNutrition"
          description: Updated items with nutrition information

    DeleteResponse:
      type: object
      required:
        - message
        - id
      properties:
        message:
          type: string
          description: Confirmation message
          example: "Consumption deleted successfully"
        id:
          type: string
          description: ID of the deleted consumption

    BiometricsResponse:
      type: object
      properties:
        biometrics:
          $ref: "#/components/schemas/UserBiometrics"
        calculated_metrics:
          type: object
          properties:
            age_years:
              type: integer
              description: Calculated age in years
            bmr:
              type: number
              description: Basal Metabolic Rate (calories/day)
            tdee:
              type: number
              description: Total Daily Energy Expenditure (calories/day)
            bmi:
              type: number
              description: Body Mass Index

    UserBiometrics:
      type: object
      properties:
        birth_date:
          type: string
          format: date
          description: Date of birth
        sex:
          type: string
          enum: [male, female, other, prefer_not_to_say]
          description: Biological sex for DRI calculations
        height_cm:
          type: number
          description: Height in centimeters
        weight_kg:
          type: number
          description: Weight in kilograms
        activity_level:
          type: string
          enum: [sedentary, lightly_active, moderately_active, very_active, extra_active]
          description: Physical activity level

    UpdateBiometricsRequest:
      type: object
      properties:
        birth_date:
          type: string
          format: date
          description: Date of birth
        sex:
          type: string
          enum: [male, female, other, prefer_not_to_say]
          description: Biological sex for DRI calculations
        height_cm:
          type: number
          minimum: 50
          maximum: 300
          description: Height in centimeters
        weight_kg:
          type: number
          minimum: 20
          maximum: 500
          description: Weight in kilograms
        activity_level:
          type: string
          enum: [sedentary, lightly_active, moderately_active, very_active, extra_active]
          description: Physical activity level
