<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>noot 🍎</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body data-theme="dark">
    <!-- Theme toggle button -->
    <button id="themeToggle" class="theme-toggle" aria-label="Toggle light/dark mode">
      <svg class="theme-icon theme-icon-dark" fill="currentColor" viewBox="0 0 24 24">
        <path d="M12 18c-3.3 0-6-2.7-6-6s2.7-6 6-6 6 2.7 6 6-2.7 6-6 6zm0-10c-2.2 0-4 1.8-4 4s1.8 4 4 4 4-1.8 4-4-1.8-4-4-4z"/>
        <path d="M12 2l-.7.7L10.6 4l.7-.7L12 2zM12 22l.7-.7L13.4 20l-.7.7L12 22zM22 12l-.7-.7L20 10.6l.7.7L22 12zM2 12l.7.7L4 13.4l-.7-.7L2 12zM20.49 3.51l-.7.7L18.36 5.64l.7-.7 1.43-1.43zM3.51 20.49l.7-.7L5.64 18.36l-.7.7-1.43 1.43zM20.49 20.49l-.7-.7L18.36 18.36l.7.7 1.43 1.43zM3.51 3.51l.7.7L5.64 5.64l-.7-.7L3.51 3.51z"/>
      </svg>
      <svg class="theme-icon theme-icon-light" fill="currentColor" viewBox="0 0 24 24">
        <path d="M12 3c-4.97 0-9 4.03-9 9s4.03 9 9 9 9-4.03 9-9c0-.46-.04-.92-.1-1.36-1.41.84-3.06 1.36-4.9 1.36-5.52 0-10-4.48-10-10 0-1.84.52-3.49 1.36-4.9C12.92 3.04 12.46 3 12 3z"/>
      </svg>
    </button>
    
    <main class="main-container">
      <button id="micBtn" class="mic-button" aria-label="Press and hold to record">
        <!-- Siri-like wave animation container -->
        <div id="siriWaves" class="siri-container">
          <!-- Background circle -->
          <div class="button-background"></div>
          
          <!-- Siri waves (hidden by default, shown when recording) -->
          <div class="recording-waves">
            <div class="siri-wave siri-wave-1"></div>
            <div class="siri-wave siri-wave-2"></div>
            <div class="siri-wave siri-wave-3"></div>
            <div class="siri-wave siri-wave-4"></div>
            <div class="siri-wave siri-wave-5"></div>
          </div>
          
          <!-- Static microphone icon (shown when not recording) -->
          <div id="staticMic" class="static-mic">
            <svg class="mic-svg" fill="currentColor" viewBox="0 0 24 24">
              <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/>
              <path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/>
            </svg>
          </div>
          
          <!-- Pulse rings -->
          <div class="pulse-ring pulse-ring-1"></div>
          <div class="pulse-ring pulse-ring-2"></div>
        </div>
      </button>

      <div id="status" class="status-message"></div>

      <div id="result" class="result-container hidden">
        <div class="summary-card">
          <h2 class="summary-title">
            📊 Nutrition Summary
          </h2>
          <div id="summary-content" class="summary-grid"></div>
        </div>
        
        <div class="transcript-card">
          <h3 class="transcript-title">What you said</h3>
          <p id="transcript-text" class="transcript-text"></p>
        </div>
      </div>
    </main>

    <script src="/app.js"></script>
  </body>
</html>
</html>
