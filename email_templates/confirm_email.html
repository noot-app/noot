<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html dir="ltr" lang="en">
<head>
    <meta content="text/html; charset=UTF-8" http-equiv="Content-Type" />
    <meta name="x-apple-disable-message-reformatting" />
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="color-scheme" content="light" />
    <meta name="supported-color-schemes" content="light" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous" />
    <link href="https://fonts.googleapis.com/css2?family=MuseoModerno:wght@400;600;700;800&display=swap" rel="stylesheet" />
    <title>Confirm Your Email - Noot</title>
    
    <style>
        /* Respect user's motion preferences */
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }
        
        a {
            text-decoration: none;
            color: #be7454;
        }

        body {
            margin: 0;
            width: 100% !important;
            background-color: #fdf8ee;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        .wrapper {
            padding: 20px 40px 16px;
            border: 1px solid #ddd9d0;
            background-color: #ffffff;
            border-radius: 24px;
        }

        .separator {
            border-style: solid;
            border-color: #f2ede3;
        }

        .button {
            background-color: #be7454;
            color: #ffffff !important;
            border: 1px solid #be7454;
            border-radius: 12px;
            text-decoration: none;
            display: inline-block;
            padding: 12px 24px;
            font-weight: 600;
            font-size: 16px;
            transition: all 0.2s ease;
        }

        .button:hover {
            background-color: #a66446;
            border-color: #a66446;
        }

        .logo {
            font-family: 'MuseoModerno', sans-serif;
            font-weight: 700;
            color: #3c3d42;
            font-size: 24px;
            margin: 0;
        }

        .footer {
            color: #81828a;
        }

        @media screen and (max-width: 599px) {
            .button {
                width: 100% !important;
                max-width: 100% !important;
                text-align: center;
            }
        }
    </style>
</head>

<body>
    <table align="center" width="100%" border="0" cellpadding="0" cellspacing="0" role="presentation" style="padding:16px;max-width:37.5em">
        <tbody>
            <tr style="width:100%">
                <td>
                    <table align="center" width="100%" class="wrapper" border="0" cellpadding="0" cellspacing="0" role="presentation" style="max-width:37.5em">
                        <tbody>
                            <tr style="width:100%">
                                <td>
                                    <!-- Header -->
                                    <table align="center" width="100%" class="header separator" border="0" cellpadding="0" cellspacing="0" role="presentation" style="padding-top:16px;margin-bottom:24px;border-bottom-width:1px">
                                        <tbody>
                                            <tr>
                                                <td>
                                                    <div class="logo" style="display:block;color:#3c3d42;font-size:24px;line-height:32px;margin-bottom:24px;font-family:'MuseoModerno',sans-serif;font-weight:700;">
                                                        NOOT
                                                    </div>
                                                </td>
                                            </tr>
                                        </tbody>
                                    </table>
                                    
                                    <!-- Main Content -->
                                    <table align="center" width="100%" border="0" cellpadding="0" cellspacing="0" role="presentation" style="font-size:18px;line-height:28px;color:#3c3d42">
                                        <tbody>
                                            <tr>
                                                <td>
                                                    <p style="margin:0 0 16px 0;">Hi,</p>
                                                    
                                                    <p style="margin:0 0 24px 0;">Welcome to Noot! Click the button below to confirm your email and start tracking your nutrition:</p>
                                                    
                                                    <!-- Button -->
                                                    <table align="center" width="100%" border="0" cellpadding="0" cellspacing="0" role="presentation" style="margin:24px 0">
                                                        <tbody>
                                                            <tr>
                                                                <td style="text-align:center;">
                                                                    <a href="{{ .ConfirmationURL }}" class="button" role="button" aria-label="Confirm your email address" style="background-color:#be7454;color:#ffffff;border:1px solid #be7454;border-radius:12px;text-decoration:none;display:inline-block;padding:12px 24px;font-weight:600;font-size:16px;">
                                                                        Activate My Account
                                                                    </a>
                                                                </td>
                                                            </tr>
                                                        </tbody>
                                                    </table>
                                                    
                                                    <p style="margin:24px 0 0 0;color:#657280;">If you did not sign up for Noot, you can ignore this email.</p>
                                                </td>
                                            </tr>
                                        </tbody>
                                    </table>
                                    
                                    <!-- Footer -->
                                    <table align="center" width="100%" class="footer separator" border="0" cellpadding="0" cellspacing="0" role="presentation" style="margin-top:24px;border-top-width:1px">
                                        <tbody>
                                            <tr>
                                                <td>
                                                    <p style="text-align:center;padding-top:24px;font-size:14px;line-height:24px;margin:16px 0;color:#81828a;">
                                                        © 2025 Noot. Made with ❤️ in San Francisco
                                                    </p>
                                                </td>
                                            </tr>
                                        </tbody>
                                    </table>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </td>
            </tr>
        </tbody>
    </table>
</body>
</html>
