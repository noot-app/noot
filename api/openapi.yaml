          enum: [weight, fitness, health, custom]
          description: Category of the goal set
          example: "fitness"
          default: "custom"
        targets:
          type: object
          additionalProperties:
            type: number
          description: Custom daily target overrides for nutrients
          example:
            calories: 3000
            protein_g: 150
            vitamin_c_mg: 120
        upper_limits:
          type: object
          additionalProperties:
            type: number
          description: Custom upper limit overrides for nutrients (maximum amounts to minimize)
          example:
