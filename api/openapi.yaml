openapi: 3.0.3 # ignore `String does not match the pattern of "^3\.1\.\d+(-.+)?$".` warnings for now: https://github.com/oapi-codegen/oapi-codegen/issues/373
info:
  title: Noot API
  description: AI-powered nutrition logging API
  version: "1.0"
  contact:
    name: Grant Birkinbine
    url: https://github.com/GrantBirki/noot

servers:
  - url: /api/v1
    description: API v1

paths:
  /consumption:
    post:
      summary: Log a consumption via audio
      description: Upload an audio file of spoken consumption data to be transcribed, parsed, and analyzed for nutrition information
      operationId: createConsumption
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                audio:
                  type: string
                  format: binary
                  description: Audio file (webm, opus, mp3, wav)
              required:
                - audio
      responses:
        "200":
          description: Successful consumption analysis
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConsumptionResponse"
        "400":
          description: Bad request (invalid multipart form, no audio file, etc.)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "405":
          description: Method not allowed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /consumption/{id}:
    put:
      summary: Update a consumption record
      description: Update an existing consumption with edited nutrition data
      operationId: updateConsumption
      parameters:
        - name: id
          in: path
          required: true
          description: Consumption ID
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateConsumptionRequest"
      responses:
        "200":
          description: Consumption updated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConsumptionResponse"
        "400":
          description: Bad request (invalid request body, validation errors)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Consumption not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    
    delete:
      summary: Delete a consumption record
      description: Delete a consumption record by ID (used for redo functionality)
      operationId: deleteConsumption
      parameters:
        - name: id
          in: path
          required: true
          description: Consumption ID
          schema:
            type: string
      responses:
        "200":
          description: Consumption deleted successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteResponse"
        "404":
          description: Consumption not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /health:
    get:
      summary: Health check
      description: Get the health status of the API
      operationId: getHealth
      responses:
        "200":
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        "405":
          description: Method not allowed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /consumptions:
    get:
      summary: List consumptions
      description: Get a list of stored consumptions for the default user
      operationId: getConsumptions
      responses:
        "200":
          description: List of consumptions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConsumptionsResponse"
        "405":
          description: Method not allowed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /nutrition-summary:
    get:
      summary: Get nutrition summary
      description: Get aggregated nutrition data over a time period
      operationId: getNutritionSummary
      parameters:
        - name: start
          in: query
          description: Start date (RFC3339 format)
          schema:
            type: string
            format: date-time
        - name: end
          in: query
          description: End date (RFC3339 format)
          schema:
            type: string
            format: date-time
        - name: days
          in: query
          description: Number of days to look back from today
          schema:
            type: integer
            minimum: 1
            maximum: 365
      responses:
        "200":
          description: Nutrition summary data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NutritionSummaryResponse"
        "400":
          description: Invalid parameters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Access denied (subscription limitation)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: User not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "405":
          description: Method not allowed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /goals:
    get:
      summary: Get nutrition goals
      description: Get resolved nutrition goals based on user profile (DRI) and any custom overrides
      operationId: getGoals
      parameters:
        - name: goal_name
          in: query
          required: false
          schema:
            type: string
          description: Name of the specific goal set to retrieve. If not provided, returns the active goal set.
      responses:
        "200":
          description: User nutrition goals
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GoalsResponse"
        "404":
          description: User not found or goal set not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    
    put:
      summary: Update nutrition goals (Pro only)
      description: Set custom nutrition goal overrides for Pro users
      operationId: updateGoals
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateGoalsRequest"
      responses:
        "200":
          description: Goals updated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GoalsResponse"
        "400":
          description: Invalid request body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Access denied (Pro subscription required)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /goals/sets:
    get:
      summary: List all goal sets (Pro only)
      description: Get a list of all custom goal sets for the user
      operationId: getGoalSets
      responses:
        "200":
          description: List of goal sets
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GoalSetsResponse"
        "403":
          description: Access denied (Pro subscription required)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /goals/sets/{name}:
    delete:
      summary: Delete a goal set (Pro only)
      description: Delete a specific custom goal set
      operationId: deleteGoalSet
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
          description: Name of the goal set to delete
      responses:
        "204":
          description: Goal set deleted successfully
        "400":
          description: Cannot delete the active goal set
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Access denied (Pro subscription required)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Goal set not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /goals/active:
    put:
      summary: Set active goal set (Pro only)
      description: Set which goal set is currently active for the user
      operationId: setActiveGoalSet
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetActiveGoalRequest"
      responses:
        "200":
          description: Active goal set updated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GoalsResponse"
        "403":
          description: Access denied (Pro subscription required)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Goal set not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /trends:
    get:
      summary: Get nutrition trends
      description: Get time series data for nutrition metrics over a specified period
      operationId: getTrends
      parameters:
        - name: metrics
          in: query
          description: Comma-separated list of metrics to include
          schema:
            type: string
            example: "calories,protein_g,total_fat_g"
        - name: start
          in: query
          description: Start date (RFC3339 format)
          schema:
            type: string
            format: date-time
        - name: end
          in: query
          description: End date (RFC3339 format)
          schema:
            type: string
            format: date-time
        - name: days
          in: query
          description: Number of days to look back from today (alternative to start/end)
          schema:
            type: integer
            minimum: 1
            maximum: 365
      responses:
        "200":
          description: Nutrition trends data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrendsResponse"
        "400":
          description: Invalid parameters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Access denied (subscription limitation)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: User not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /export:
    get:
      summary: Export nutrition data (Pro only)
      description: Export nutrition data in CSV or JSON format for a specified date range
      operationId: exportData
      parameters:
        - name: format
          in: query
          required: true
          description: Export format
          schema:
            type: string
            enum: [csv, json]
        - name: start
          in: query
          description: Start date (RFC3339 format)
          schema:
            type: string
            format: date-time
        - name: end
          in: query
          description: End date (RFC3339 format)
          schema:
            type: string
            format: date-time
        - name: metrics
          in: query
          description: Comma-separated list of metrics to include (defaults to common macros)
          schema:
            type: string
            example: "calories,protein_g,total_fat_g,total_carbs_g"
      responses:
        "200":
          description: Exported data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExportResponse"
            text/csv:
              schema:
                type: string
                format: binary
        "400":
          description: Invalid parameters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Access denied (Pro subscription required)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: User not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /biometrics:
    get:
      summary: Get user biometrics
      description: Retrieve current biometric data for the authenticated user
      operationId: getUserBiometrics
      responses:
        "200":
          description: User biometrics data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BiometricsResponse"
        "404":
          description: User not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    
    put:
      summary: Update user biometrics
      description: Create or update biometric data for the authenticated user
      operationId: updateUserBiometrics
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateBiometricsRequest"
      responses:
        "200":
          description: Biometrics updated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BiometricsResponse"
        "400":
          description: Invalid request data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    
    delete:
      summary: Delete user biometrics
      description: Delete all biometric data for the authenticated user
      operationId: deleteUserBiometrics
      responses:
        "200":
          description: Biometrics deleted successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteResponse"
        "404":
          description: Biometrics not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  schemas:
    ErrorResponse:
      type: object
      required:
        - error
        - code
        - timestamp
      properties:
        error:
          type: string
          description: Error message
        code:
          type: integer
          description: HTTP status code
        timestamp:
          type: string
          format: date-time
          description: Timestamp when the error occurred
        stack:
          type: array
          items:
            type: string
          description: Stack trace (only in debug mode)
        trace_id:
          type: string
          description: Request trace ID

    HealthResponse:
      type: object
      required:
        - status
        - timestamp
        - version
      properties:
        status:
          type: string
          example: "healthy"
        timestamp:
          type: string
          format: date-time
        version:
          type: string
          example: "dev"

    ConsumptionResponse:
      type: object
      required:
        - id
        - transcript
        - parsedItems
        - items
        - summary
        - request_id
      properties:
        id:
          type: string
          description: Consumption ID (for future edits/deletes)
        transcript:
          type: string
          description: Transcribed text from audio
        parsedItems:
          type: array
          items:
            $ref: "#/components/schemas/Item"
          description: Items parsed from transcript (without nutrition data)
        items:
          type: array
          items:
            $ref: "#/components/schemas/ItemWithNutrition"
          description: Items with complete nutrition information
        summary:
          $ref: "#/components/schemas/Summary"
        request_id:
          type: string
          description: Request identifier for tracking

    ConsumptionsResponse:
      type: object
      required:
        - consumptions
        - user
        - count
      properties:
        consumptions:
          type: array
          items:
            $ref: "#/components/schemas/Consumption"
        user:
          $ref: "#/components/schemas/User"
        count:
          type: integer
          description: Number of consumptions returned

    NutritionSummaryResponse:
      type: object
      required:
        - summary
        - user
        - days
        - date_range
      properties:
        summary:
          $ref: "#/components/schemas/NutritionSummary"
        user:
          $ref: "#/components/schemas/User"
        days:
          type: integer
          description: Number of days in the summary
        date_range:
          type: object
          properties:
            start:
              type: string
              format: date-time
            end:
              type: string
              format: date-time

    Item:
      type: object
      required:
        - name
        - grams
      properties:
        name:
          type: string
          description: Name of the food item
        grams:
          type: number
          description: Weight in grams (standardized internally)
        user_quantity:
          type: number
          nullable: true
          description: Original user input quantity for display
        user_unit:
          type: string
          nullable: true
          description: Original user input unit for display
        brand:
          type: string
          nullable: true
          description: Brand name
        note:
          type: string
          nullable: true
          maxLength: 1000
          description: Additional note about the item
        label:
          type: string
          nullable: true
          maxLength: 63
          description: Custom label for the item
        nutrients:
          $ref: "#/components/schemas/CompleteNutrient"

    ItemWithNutrition:
      type: object
      required:
        - item
      properties:
        item:
          $ref: "#/components/schemas/Item"
        note:
          type: string
          description: Additional note (e.g., if nutrition data unavailable)

    CompleteNutrient:
      type: object
      required:
        - calories
        - protein_g
        - total_fat_g
        - saturated_fat_g
        - trans_fat_g
        - cholesterol_mg
        - sodium_mg
        - total_carbs_g
        - dietary_fiber_g
        - total_sugars_g
        - added_sugars_g
        - vitamin_a_mcg
        - vitamin_c_mg
        - vitamin_d_mcg
        - vitamin_e_mg
        - vitamin_k_mcg
        - thiamine_mg
        - riboflavin_mg
        - niacin_mg
        - vitamin_b6_mg
        - folate_mcg
        - vitamin_b12_mcg
        - calcium_mg
        - iron_mg
        - magnesium_mg
        - phosphorus_mg
        - potassium_mg
        - zinc_mg
        - copper_mg
        - manganese_mg
        - selenium_mcg
        - biotin_mcg
        - pantothenic_acid_mg
        - choline_mg
        - chloride_mg
        - chromium_mcg
        - fluoride_mg
        - iodine_mcg
        - molybdenum_mcg
        - omega3_ala_g
        - omega3_epa_g
        - omega3_dha_g
        - omega6_g
        - creatine_mg
        - caffeine_mg
        - alcohol_g
        - polyunsaturated_fat_g
        - monounsaturated_fat_g
      properties:
        calories:
          type: number
          description: Calories per serving
        protein_g:
          type: number
          description: Protein in grams
        total_fat_g:
          type: number
          description: Total fat in grams
        saturated_fat_g:
          type: number
          description: Saturated fat in grams
        trans_fat_g:
          type: number
          description: Trans fat in grams
        cholesterol_mg:
          type: number
          description: Cholesterol in milligrams
        sodium_mg:
          type: number
          description: Sodium in milligrams
        total_carbs_g:
          type: number
          description: Total carbohydrates in grams
        dietary_fiber_g:
          type: number
          description: Dietary fiber in grams
        total_sugars_g:
          type: number
          description: Total sugars in grams
        added_sugars_g:
          type: number
          description: Added sugars in grams
        vitamin_a_mcg:
          type: number
          description: Vitamin A in micrograms
        vitamin_c_mg:
          type: number
          description: Vitamin C in milligrams
        vitamin_d_mcg:
          type: number
          description: Vitamin D in micrograms
        vitamin_e_mg:
          type: number
          description: Vitamin E in milligrams
        vitamin_k_mcg:
          type: number
          description: Vitamin K in micrograms
        thiamine_mg:
          type: number
          description: Thiamine (B1) in milligrams
        riboflavin_mg:
          type: number
          description: Riboflavin (B2) in milligrams
        niacin_mg:
          type: number
          description: Niacin (B3) in milligrams
        vitamin_b6_mg:
          type: number
          description: Vitamin B6 in milligrams
        folate_mcg:
          type: number
          description: Folate in micrograms
        vitamin_b12_mcg:
          type: number
          description: Vitamin B12 in micrograms
        calcium_mg:
          type: number
          description: Calcium in milligrams
        iron_mg:
          type: number
          description: Iron in milligrams
        magnesium_mg:
          type: number
          description: Magnesium in milligrams
        phosphorus_mg:
          type: number
          description: Phosphorus in milligrams
        potassium_mg:
          type: number
          description: Potassium in milligrams
        zinc_mg:
          type: number
          description: Zinc in milligrams
        copper_mg:
          type: number
          description: Copper in milligrams
        manganese_mg:
          type: number
          description: Manganese in milligrams
        selenium_mcg:
          type: number
          description: Selenium in micrograms
        biotin_mcg:
          type: number
          description: Biotin in micrograms
        pantothenic_acid_mg:
          type: number
          description: Pantothenic Acid (B5) in milligrams
        choline_mg:
          type: number
          description: Choline in milligrams
        chloride_mg:
          type: number
          description: Chloride in milligrams
        chromium_mcg:
          type: number
          description: Chromium in micrograms
        fluoride_mg:
          type: number
          description: Fluoride in milligrams
        iodine_mcg:
          type: number
          description: Iodine in micrograms
        molybdenum_mcg:
          type: number
          description: Molybdenum in micrograms
        omega3_ala_g:
          type: number
          description: Omega-3 ALA (Alpha-linolenic acid) in grams
        omega3_epa_g:
          type: number
          description: Omega-3 EPA (Eicosapentaenoic acid) in grams
        omega3_dha_g:
          type: number
          description: Omega-3 DHA (Docosahexaenoic acid) in grams
        omega6_g:
          type: number
          description: Omega-6 fatty acids in grams
        creatine_mg:
          type: number
          description: Creatine in milligrams
        caffeine_mg:
          type: number
          description: Caffeine in milligrams
        alcohol_g:
          type: number
          description: Alcohol in grams
        polyunsaturated_fat_g:
          type: number
          description: Polyunsaturated fat in grams
        monounsaturated_fat_g:
          type: number
          description: Monounsaturated fat in grams

    Summary:
      type: object
      required:
        - totals
        - percent_of_daily
        - daily_values
      properties:
        totals:
          $ref: "#/components/schemas/CompleteNutrient"
        percent_of_daily:
          type: object
          additionalProperties:
            type: integer
          description: Percentage of daily values for each nutrient
        daily_values:
          type: object
          additionalProperties:
            type: number
          description: Daily value amounts used for calculations

    User:
      type: object
      required:
        - id
        - handle
        - email
        - subscription_tier
        - created_at
      properties:
        id:
          type: string
          description: User ID (auth.users.id UUID for Supabase)
        handle:
          type: string
          description: Unique user handle/username
        full_name:
          type: string
          nullable: true
          description: User's full display name
        email:
          type: string
          description: User email address
        subscription_tier:
          type: string
          enum: [free, pro]
          description: User subscription level
        avatar_url:
          type: string
          nullable: true
          description: User avatar/profile image URL
        created_at:
          type: string
          format: date-time
          description: User creation timestamp

    Consumption:
      type: object
      required:
        - id
        - user_id
        - transcript
        - items
        - summary
        - created_at
      properties:
        id:
          type: string
          description: Consumption ID
        user_id:
          type: string
          description: User ID who logged this consumption
        transcript:
