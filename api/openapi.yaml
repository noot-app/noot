          description: When the favorite was created
        consumption:
          $ref: "#/components/schemas/Consumption"

    AddFavoriteRequest:
      type: object
      required:
        - consumption_id
      properties:
        consumption_id:
          type: string
          description: ID of the consumption to add to favorites

    BiometricsResponse:
      type: object
      properties:
        biometrics:
          $ref: "#/components/schemas/UserBiometrics"
        calculated_metrics:
          type: object
          properties:
            age_years:
              type: integer
              description: Calculated age in years
            bmr:
              type: number
              description: Basal Metabolic Rate (calories/day)
            tdee:
              type: number
              description: Total Daily Energy Expenditure (calories/day)
            bmi:
              type: number
              description: Body Mass Index

    UserBiometrics:
      type: object
      properties:
        birth_date:
          type: string
          format: date
          description: Date of birth
        sex:
          type: string
          enum: [male, female, other, prefer_not_to_say]
          description: Biological sex for DRI calculations
        height_cm:
          type: number
          description: Height in centimeters
        weight_kg:
          type: number
          description: Weight in kilograms
        activity_level:
          type: string
          enum: [sedentary, lightly_active, moderately_active, very_active, extra_active]
          description: Physical activity level

    UpdateBiometricsRequest:
      type: object
      properties:
        birth_date:
          type: string
          format: date
          description: Date of birth
        sex:
          type: string
          enum: [male, female, other, prefer_not_to_say]
          description: Biological sex for DRI calculations
        height_cm:
          type: number
          minimum: 50
          maximum: 300
          description: Height in centimeters
        weight_kg:
          type: number
          minimum: 20
          maximum: 500
          description: Weight in kilograms
        activity_level:
          type: string
          enum: [sedentary, lightly_active, moderately_active, very_active, extra_active]
          description: Physical activity level

    APIKey:
      type: object
      required:
        - id
        - user_id
        - name
        - prefix
        - scope
        - created_at
      properties:
        id:
          type: string
          description: Unique identifier for the API key
        user_id:
          type: string
          description: ID of the user who owns this key
        name:
          type: string
          description: User-defined name for the key
          example: "Production API Key"
        prefix:
          type: string
          description: Visible prefix for identification (e.g., noot_abc123)
          example: "noot_abc123"
        scope:
          type: string
          enum: [read, read_write]
          description: Permissions scope for the API key
        created_at:
          type: string
          format: date-time
          description: When the API key was created
        last_used_at:
          type: string
          format: date-time
          description: When the API key was last used
          nullable: true
        expires_at:
          type: string
          format: date-time
          description: When the API key expires (null for no expiration)
          nullable: true
        revoked_at:
          type: string
          format: date-time
          description: When the API key was revoked (null if active)
          nullable: true

    CreateAPIKeyRequest:
      type: object
      required:
        - name
        - scope
      properties:
        name:
          type: string
          maxLength: 100
          description: User-defined name for the API key
          example: "Production API Key"
        scope:
          type: string
          enum: [read, read_write]
          description: Permissions scope - 'read' for GET requests only, 'read_write' for all operations
        expires_at:
          type: string
          format: date-time
          description: Optional expiration date (null for no expiration)
          nullable: true

    CreateAPIKeyResponse:
      type: object
      required:
        - api_key
        - secret
      properties:
        api_key:
          $ref: "#/components/schemas/APIKey"
        secret:
          type: string
          description: Full API key secret (only returned once at creation or rotation)
          example: "noot_abc123_def456ghi789jkl012mno345pqr678stu901vwx234yz"

    APIKeysResponse:
      type: object
      required:
        - api_keys
      properties:
        api_keys:
          type: array
          items:
            $ref: "#/components/schemas/APIKey"
          description: List of API keys (secrets not included)

  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: API key for Pro users

security:
  - BearerAuth: []
  - ApiKeyAuth: []
