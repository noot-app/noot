components:
  schemas:
    ErrorResponse:
      type: object
      required:
        - error
        - code
        - timestamp
      properties:
        error:
          type: string
          description: Error message
        code:
          type: integer
          description: HTTP status code
        timestamp:
          type: string
          format: date-time
          description: Timestamp when the error occurred
        stack:
          type: array
          items:
            type: string
          description: Stack trace (only in debug mode)
        trace_id:
          type: string
          description: Request trace ID

    HealthResponse:
      type: object
      required:
        - status
        - timestamp
        - version
      properties:
        status:
          type: string
          example: "healthy"
        timestamp:
          type: string
          format: date-time
        version:
          type: string
          example: "dev"

    Label:
      type: object
      required: [id, name, color, created_at, updated_at]
      properties:
        id:
          type: string
          description: Label ID
        name:
          type: string
          maxLength: 63
          description: Label name
        description:
          type: string
          maxLength: 250
          nullable: true
          description: Optional description of the label
        color:
          type: string
          description: Hex color (#RRGGBB or RRGGBB)
          example: "#1E90FF"
        created_at:
          type: string
          format: date-time
          description: When the label was created
        updated_at:
          type: string
          format: date-time
          description: When the label was last updated

    LabelCreateRequest:
      type: object
      required: [name, color]
      properties:
        name:
          type: string
          maxLength: 63
          description: Label name (unique per user, case-insensitive)
        description:
          type: string
          maxLength: 250
          description: Optional description of the label
        color:
          type: string
          description: Hex color (#RRGGBB or RRGGBB)
          example: "#1E90FF"

    LabelUpdateRequest:
      type: object
      properties:
        name:
          type: string
          maxLength: 63
          description: Label name (unique per user, case-insensitive)
        description:
          type: string
          maxLength: 250
          nullable: true
          description: Optional description of the label
        color:
          type: string
          description: Hex color (#RRGGBB or RRGGBB)
          example: "#1E90FF"

    LabelWithUsage:
      type: object
      required: [id, name, color, created_at, updated_at, consumption_count, item_count]
      properties:
        id:
          type: string
          description: Label ID
        name:
          type: string
          maxLength: 63
          description: Label name
        description:
          type: string
          maxLength: 250
          nullable: true
          description: Optional description of the label
        color:
          type: string
          description: Hex color (#RRGGBB)
          example: "#1E90FF"
        created_at:
          type: string
          format: date-time
          description: When the label was created
        updated_at:
          type: string
          format: date-time
          description: When the label was last updated
        consumption_count:
          type: integer
          description: Number of consumptions using this label
        item_count:
          type: integer
          description: Number of consumption items using this label

    LabelsResponse:
      type: object
      required: [labels]
      properties:
        labels:
          type: array
          items:
            $ref: "#/components/schemas/LabelWithUsage"

    AssignLabelsRequest:
      type: object
      required: [ids]
      properties:
        ids:
          type: array
          items:
            type: string
          description: Array of label IDs to assign

    EventType:
      type: object
      required: [id, user_id, name, color, created_at, updated_at]
      properties:
        id:
          type: string
          description: Event type ID
        user_id:
          type: string
          description: User ID who owns this event type
        name:
          type: string
          maxLength: 63
          description: Event type name
        description:
          type: string
          maxLength: 250
          nullable: true
          description: Optional description of the event type
        default_name:
          type: string
          maxLength: 100
          nullable: true
          description: Default name suggestion when creating events of this type
        color:
          type: string
          description: Hex color for visual distinction (#RRGGBB)
          example: "#FF6B6B"
        created_at:
          type: string
          format: date-time
          description: When the event type was created
        updated_at:
          type: string
          format: date-time
          description: When the event type was last updated

    EventTypeCreateRequest:
      type: object
      required: [name, color]
      properties:
        name:
          type: string
          maxLength: 63
          description: Event type name (unique per user, case-insensitive)
        description:
          type: string
          maxLength: 250
          description: Optional description of the event type
        default_name:
          type: string
          maxLength: 100
          description: Default name suggestion when creating events of this type
        color:
          type: string
          description: Hex color for visual distinction (#RRGGBB)
          example: "#FF6B6B"

    EventTypeUpdateRequest:
      type: object
      properties:
        name:
          type: string
          maxLength: 63
          description: Event type name (unique per user, case-insensitive)
        description:
          type: string
          maxLength: 250
          nullable: true
