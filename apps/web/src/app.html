<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />

    <!-- Adaptive SVG Favicon (Primary - supports light/dark mode) -->
    <link
      rel="icon"
      href="%sveltekit.assets%/favicon.svg"
      type="image/svg+xml"
    />

    <!-- Fallback PNG Favicon for older browsers -->
    <link rel="icon" href="%sveltekit.assets%/favicon.png" type="image/png" />

    <!-- Apple Touch Icon -->
    <link
      rel="apple-touch-icon"
      href="%sveltekit.assets%/images/logo-light.png"
    />

    <!-- Theme color for browser UI -->
    <meta
      name="theme-color"
      content="#be7454"
      media="(prefers-color-scheme: light)"
    />
    <meta
      name="theme-color"
      content="#3a3b40"
      media="(prefers-color-scheme: dark)"
    />

    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />

    <!-- Critical CSS for layout -->
    <style nonce="%sveltekit.csp.nonce%">
      .app-body {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }
      .app-content {
        display: contents;
      }
    </style>

    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover" class="app-body">
    <div class="app-content">%sveltekit.body%</div>
  </body>
</html>
