name: deploy

on:
  push:
    paths-ignore:
      - "LICENSE"
      - "README.md"
      - ".gitignore"
    branches:
      - main
  workflow_dispatch:

# Allow one concurrent deployment
concurrency:
  group: "production"
  cancel-in-progress: true

# Default to bash
defaults:
  run:
    shell: bash

# set an environment variable for use in the jobs pointing to my site
env:
  web_url: https://nootapp.io

jobs:
  deployment-check:
    permissions:
      contents: read
      deployments: read
    runs-on: ubuntu-latest
    outputs: # set outputs for use in downstream jobs
      continue: ${{ steps.deployment-check.outputs.continue }}

    steps:
      # https://github.com/github/branch-deploy/blob/d3c24bd92505e623615b75ffdfac5ed5259adbdb/docs/merge-commit-strategy.md
      - name: deployment check
        uses: github/branch-deploy@v11.1.2
        id: deployment-check
        with:
          merge_deploy_mode: "true"
          environment: production

  deploy:
    permissions:
      contents: read
    environment:
      name: production
      url: ${{ env.web_url }}
    if: ${{ needs.deployment-check.outputs.continue == 'true' }}
    needs: deployment-check
    runs-on: ubuntu-latest

    steps:
      - name: checkout
        uses: actions/checkout@v5

      - name: setup go
        uses: actions/setup-go@v5
        with:
          go-version-file: "go.mod"
          cache: true

      - uses: actions/setup-node@v4.4.0
        with:
          node-version-file: apps/web/.node-version
          cache: "npm"
          cache-dependency-path: "apps/web/package-lock.json"

      - name: bootstrap
        run: script/bootstrap --ci

      - name: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          NODE_ENV: "production"
        run: script/deploy frontend
