<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>noot 🍎</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body data-theme="dark">
    <!-- Development banner (only shown in development mode) -->
    <div id="dev-banner" class="dev-banner hidden">
      <div class="dev-banner-content">
        <span class="dev-banner-text">🚧 Development Mode</span>
        <button id="simulate-btn" class="simulate-btn">Simulate</button>
      </div>
    </div>
    
    <!-- Theme toggle button -->
    <button id="themeToggle" class="theme-toggle" aria-label="Toggle light/dark mode">
      <!-- Sun icon (shows in dark mode, switches to light) -->
      <svg class="theme-icon theme-icon-dark" fill="currentColor" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="3" fill="currentColor"/>
        <path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      </svg>
      <!-- Moon icon (shows in light mode, switches to dark) -->
      <svg class="theme-icon theme-icon-light" fill="currentColor" viewBox="0 0 24 24">
        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
      </svg>
    </button>
    
    <!-- Navigation -->
    <nav class="nav-container">
      <div class="nav-brand">
        <span class="nav-title">noot 🍎</span>
      </div>
      <div class="nav-menu">
        <button id="navRecord" class="nav-button active" data-view="record">
          🎤 Record
        </button>
        <button id="navSummary" class="nav-button" data-view="summary">
          📊 Summary
        </button>
      </div>
    </nav>
    
    <main class="main-container">
      <!-- Record View -->
      <div id="recordView" class="view active">
        <button id="micBtn" class="mic-button" aria-label="Press and hold to record">
          <!-- Siri-like wave animation container -->
          <div id="siriWaves" class="siri-container">
            <!-- Background circle -->
            <div class="button-background"></div>
            
            <!-- Siri waves (hidden by default, shown when recording) -->
            <div class="recording-waves">
              <div class="siri-wave siri-wave-1"></div>
              <div class="siri-wave siri-wave-2"></div>
              <div class="siri-wave siri-wave-3"></div>
              <div class="siri-wave siri-wave-4"></div>
              <div class="siri-wave siri-wave-5"></div>
            </div>
            
            <!-- Static microphone icon (shown when not recording) -->
            <div id="staticMic" class="static-mic">
              <svg class="mic-svg" fill="currentColor" viewBox="0 0 24 24">
                <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/>
                <path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/>
              </svg>
            </div>
            
            <!-- Pulse rings -->
            <div class="pulse-ring pulse-ring-1"></div>
            <div class="pulse-ring pulse-ring-2"></div>
          </div>
        </button>

        <div id="status" class="status-message"></div>

        <div id="result" class="result-container hidden">
          <div class="summary-card">
            <h2 class="summary-title">
              📊 Nutrition Summary
            </h2>
            <div id="summary-content" class="summary-grid"></div>
          </div>
          
          <div class="items-card">
            <h2 class="items-title">
              🍽️ Individual Items
            </h2>
            <div id="items-content" class="items-container"></div>
          </div>
          
          <div class="transcript-card">
            <h3 class="transcript-title">What you said</h3>
            <p id="transcript-text" class="transcript-text"></p>
          </div>
        </div>
      </div>

      <!-- Nutrition Summary View -->
      <div id="summaryView" class="view">
        <div class="summary-header">
          <h1>📊 Nutrition Summary</h1>
          <div class="time-selector">
            <button id="day1Btn" class="time-btn active" data-days="1">Today</button>
            <button id="day7Btn" class="time-btn" data-days="7">Week</button>
          </div>
        </div>
        
        <div id="summaryLoading" class="loading-container hidden">
          <div class="loading-spinner"></div>
          <p>Loading nutrition data...</p>
        </div>
        
        <div id="summaryError" class="error-container hidden">
          <p class="error-message">Failed to load nutrition summary. Please try again.</p>
          <button id="retryBtn" class="retry-btn">Retry</button>
        </div>
        
        <div id="summaryData" class="summary-content hidden">
          <div class="summary-overview">
            <div class="overview-stats">
              <div class="stat-card">
                <div class="stat-value" id="totalConsumptions">-</div>
                <div class="stat-label">Consumptions</div>
              </div>
              <div class="stat-card">
                <div class="stat-value" id="totalCalories">-</div>
                <div class="stat-label">Calories</div>
              </div>
              <div class="stat-card">
                <div class="stat-value" id="avgCalories">-</div>
                <div class="stat-label">Avg/Day</div>
              </div>
            </div>
          </div>
          
          <div class="macro-breakdown">
            <h3>Macronutrients</h3>
            <div class="macro-grid">
              <div class="macro-item">
                <div class="macro-header">
                  <span class="macro-label">Protein</span>
                  <span class="macro-value" id="totalProtein">-g</span>
                </div>
                <div class="progress-bar">
                  <div class="progress-fill protein" id="proteinProgress"></div>
                </div>
              </div>
              <div class="macro-item">
                <div class="macro-header">
                  <span class="macro-label">Carbs</span>
                  <span class="macro-value" id="totalCarbs">-g</span>
                </div>
                <div class="progress-bar">
                  <div class="progress-fill carbs" id="carbsProgress"></div>
                </div>
              </div>
              <div class="macro-item">
                <div class="macro-header">
                  <span class="macro-label">Fat</span>
                  <span class="macro-value" id="totalFat">-g</span>
                </div>
                <div class="progress-bar">
                  <div class="progress-fill fat" id="fatProgress"></div>
                </div>
              </div>
              <div class="macro-item">
                <div class="macro-header">
                  <span class="macro-label">Fiber</span>
                  <span class="macro-value" id="totalFiber">-g</span>
                </div>
                <div class="progress-bar">
                  <div class="progress-fill fiber" id="fiberProgress"></div>
                </div>
              </div>
            </div>
          </div>
          
          <div class="daily-chart">
            <h3>Daily Breakdown</h3>
            <div id="chartContainer" class="chart-container">
              <canvas id="dailyChart" width="400" height="200"></canvas>
            </div>
          </div>
        </div>
      </div>
    </main>

    <script src="/app.js"></script>
  </body>
</html>
</html>
